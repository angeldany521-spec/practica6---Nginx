# docker-compose.yml
version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: holamundo_db
      MYSQL_USER: dev_user
      MYSQL_PASSWORD: dev_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: ./src
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: dev_user
      DB_PASSWORD: dev_password
      DB_NAME: holamundo_db
    depends_on:
      - db

volumes:
  db_data: